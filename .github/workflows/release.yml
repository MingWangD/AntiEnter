name: Build & Release AntiEnter (macOS & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Tests
        run: |
          python3 tests/test_hook.py

      - name: Build macOS AntiEnter.app & Package
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh

      - name: Package Windows AntiEnter.zip
        run: |
          chmod +x scripts/package_windows.sh
          ./scripts/package_windows.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/AntiEnter-*-macOS.zip
            dist/AntiEnter-*-windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
