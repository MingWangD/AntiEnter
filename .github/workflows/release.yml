name: Build & Release AntiEnter (macOS & Windows)

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: Run Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.12']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Tests
        run: |
          python -m unittest discover tests/

  build-and-release:
    name: Build & Release Packages
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build macOS AntiEnter.app & Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9] ]]; then
            VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          fi
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh "$VERSION"

      - name: Package Windows AntiEnter.zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9] ]]; then
            VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          fi
          chmod +x scripts/package_windows.sh
          ./scripts/package_windows.sh "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/AntiEnter-*-macOS.zip
            dist/AntiEnter-*-windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
